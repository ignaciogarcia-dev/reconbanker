version: 2
updates:
  # npm — a SINGLE entry at the workspace root covers the whole pnpm
  # workspace (root + client). There is one shared root pnpm-lock.yaml, so
  # a separate `directory: /client` entry can never regenerate it and always
  # failed frozen-install (ERR_PNPM_OUTDATED_LOCKFILE). Dependabot detects the
  # `client` workspace package from here and updates both manifests against
  # the one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      workspace-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
